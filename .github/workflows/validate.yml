name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Drive stylesheet
        run: |
          mkdir -p src/styles
          base64 --decode .github/pages/global.css.gz.b64 | gzip -dc > src/styles/global.css

      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Validate agent files
        run: pnpm validate

      - name: Type check
        if: github.event_name != 'pull_request'
        run: pnpm check

      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm build
