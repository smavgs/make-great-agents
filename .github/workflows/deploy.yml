name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Drive stylesheet
        run: |
          mkdir -p src/styles
          base64 --decode .github/pages/global.css.gz.b64 | gzip -dc > src/styles/global.css

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate agents
        run: pnpm validate

      - name: Build Astro site
        run: pnpm build

      - name: Prepare build for GitHub project Pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'dist';
          const prefix = '/make-great-agents';
          const productionOrigin = 'https://makegreatagents.com';
          const pagesOrigin = 'https://smavgs.github.io/make-great-agents';
          const textExts = new Set(['.html', '.css', '.js', '.json', '.xml', '.txt']);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (textExts.has(path.extname(entry.name))) {
                let text = fs.readFileSync(full, 'utf8');
                text = text.split(productionOrigin).join(pagesOrigin);
                text = text.replace(/(href|src|action|srcset)=(['"])\/(?!make-great-agents\/)/g, `$1=$2${prefix}/`);
                text = text.replace(/url\((['"]?)\/(?!make-great-agents\/)/g, `url($1${prefix}/`);
                fs.writeFileSync(full, text);
              }
            }
          }

          walk(root);
          fs.writeFileSync(path.join(root, '.nojekyll'), '');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
